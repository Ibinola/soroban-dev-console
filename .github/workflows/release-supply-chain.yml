name: Release Supply Chain
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  sbom-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t api:${{ github.sha }} -f apps/api/Dockerfile .

      # #1413: SBOM artifact
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: api:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # #1414: signed provenance for container releases
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: sbom.spdx.json
