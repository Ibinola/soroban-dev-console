name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[^ ].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            doesn't match the configured pattern. The subject must not start with a space.
          headerPattern: ^(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\(.+\))?[: ].+
          headerPatternError: |
            The header "{header}" found in the pull request title "{title}"
            doesn't match the conventional commit format.

            Expected format: <type>(<optional scope>): <description>

            Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

            Examples:
              feat(auth): add OAuth2 login support
              fix: resolve race condition in event handler
              docs: update API reference for contract endpoints
              ci: add PR title validation workflow
