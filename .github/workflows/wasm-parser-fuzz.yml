# Issue #1219: WASM contract-spec parser fuzz suite
name: WASM Parser Fuzz

on:
  push:
    branches: ["main"]
    paths:
      - "packages/soroban-utils/**"
      - "apps/web/lib/wasm-parser-fuzz.test.ts"
      - ".github/workflows/wasm-parser-fuzz.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/soroban-utils/**"
      - "apps/web/lib/wasm-parser-fuzz.test.ts"
      - ".github/workflows/wasm-parser-fuzz.yml"

jobs:
  fuzz:
    name: Malformed WASM fuzz suite
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run WASM parser fuzz tests
        run: npm run test:run -w web -- lib/wasm-parser-fuzz.test.ts
        env:
          WASM_FUZZ_SEED: "3223760450"
