name: Lint & Format Check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  lint-format:
    name: ESLint & Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint across workspaces
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "**/*.{ts,tsx,md}" --ignore-path .gitignore
