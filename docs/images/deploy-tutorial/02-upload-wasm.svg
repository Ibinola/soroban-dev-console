<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#f8fafc"/>
