  <text x="216" y="124" font-size="12" fill="#64748b" font-weight="400">Configure</text>
  <circle cx="350" cy="120" r="10" fill="#e2e8f0"/><text x="350" y="124" font-size="11" text-anchor="middle" fill="#64748b" font-weight="600">3</text>
  <text x="366" y="124" font-size="12" fill="#64748b" font-weight="400">Review &amp; simulate</text>
  <circle cx="500" cy="120" r="10" fill="#e2e8f0"/><text x="500" y="124" font-size="11" text-anchor="middle" fill="#64748b" font-weight="600">4</text>
