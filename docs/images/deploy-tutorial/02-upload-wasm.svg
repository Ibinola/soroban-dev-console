  <circle cx="712" cy="232" r="12" fill="#e11d48"/><text x="712" y="237" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">2</text>
  <text x="40" y="322" font-size="12" fill="#be123c">① Pick the .wasm built by stellar contract build. ② Next stays disabled until a .wasm file is selected.</text>
