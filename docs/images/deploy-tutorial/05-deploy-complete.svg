<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#f8fafc"/>
  <rect x="0" y="0" width="760" height="28" fill="#e2e8f0"/>
  <circle cx="16" cy="14" r="5" fill="#f87171"/><circle cx="32" cy="14" r="5" fill="#fbbf24"/><circle cx="48" cy="14" r="5" fill="#34d399"/>
  <rect x="70" y="6" width="420" height="16" rx="8" fill="#ffffff"/>
  <text x="82" y="18" font-size="11" fill="#475569">localhost:3000/deploy</text>
  <text x="40" y="70" font-size="24" font-weight="700" fill="#0f172a">Deploy Contract</text>
  <text x="40" y="94" font-size="13" fill="#64748b">Upload, simulate, and deploy your Soroban smart contract.</text>
  <circle cx="50" cy="120" r="10" fill="#0f172a"/><text x="50" y="124" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <text x="66" y="124" font-size="12" fill="#0f172a" font-weight="400">Upload WASM</text>
  <circle cx="200" cy="120" r="10" fill="#0f172a"/><text x="200" y="124" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <text x="216" y="124" font-size="12" fill="#0f172a" font-weight="400">Configure</text>
  <circle cx="350" cy="120" r="10" fill="#0f172a"/><text x="350" y="124" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <text x="366" y="124" font-size="12" fill="#0f172a" font-weight="400">Review &amp; simulate</text>
  <circle cx="500" cy="120" r="10" fill="#1e293b"/><text x="500" y="124" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <text x="516" y="124" font-size="12" fill="#0f172a" font-weight="700">Deploy</text>
  <rect x="40" y="144" width="680" height="280" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="176" font-size="16" font-weight="700" fill="#0f172a">Step 4: Deploy</text>
  <text x="60" y="196" font-size="12" fill="#64748b">Confirm the simulation results and deploy your contract on-chain.</text>
  <rect x="60" y="210" width="640" height="104" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="232" font-size="12" fill="#64748b">File</text><text x="684" y="232" font-size="12" text-anchor="end" fill="#0f172a">counter_fixture.wasm</text>
  <text x="76" y="254" font-size="12" fill="#64748b">Estimated Fee</text><text x="684" y="254" font-size="12" text-anchor="end" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">1,234,567 stroops</text>
  <text x="76" y="276" font-size="12" fill="#64748b">Salt</text><text x="684" y="276" font-size="12" text-anchor="end" fill="#0f172a">default (zero salt)</text>
  <text x="76" y="298" font-size="12" fill="#64748b">Network</text><text x="684" y="298" font-size="12" text-anchor="end" fill="#0f172a">testnet</text>
  <rect x="60" y="326" width="640" height="84" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="76" y="350" font-size="13" font-weight="700" fill="#15803d">✓ Deployment Complete!</text>
  <text x="76" y="370" font-size="11" fill="#64748b">Contract ID:</text>
  <rect x="76" y="378" width="580" height="24" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="86" y="394" font-size="11" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">CAXY…7Q2M</text>
  <text x="676" y="395" font-size="14" text-anchor="middle" fill="#475569">⧉</text>
  <circle cx="48" cy="298" r="12" fill="#e11d48"/><text x="48" y="303" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">1</text>
  <circle cx="48" cy="326" r="12" fill="#e11d48"/><text x="48" y="331" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">2</text>
  <text x="40" y="452" font-size="12" fill="#be123c">① Check the network row before you sign. ② The new contract ID is shown here and added to your contract list.</text>
</svg>
