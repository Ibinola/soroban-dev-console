<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#f8fafc"/>
  <rect x="0" y="0" width="760" height="28" fill="#e2e8f0"/>
  <circle cx="16" cy="14" r="5" fill="#f87171"/><circle cx="32" cy="14" r="5" fill="#fbbf24"/><circle cx="48" cy="14" r="5" fill="#34d399"/>
  <rect x="70" y="6" width="420" height="16" rx="8" fill="#ffffff"/>
  <text x="82" y="18" font-size="11" fill="#475569">localhost:3000/deploy</text>
  <text x="40" y="70" font-size="24" font-weight="700" fill="#0f172a">Deploy Contract</text>
  <text x="40" y="94" font-size="13" fill="#64748b">Upload, simulate, and deploy your Soroban smart contract.</text>
  <circle cx="50" cy="120" r="10" fill="#0f172a"/><text x="50" y="124" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <text x="66" y="124" font-size="12" fill="#0f172a" font-weight="400">Upload WASM</text>
  <circle cx="200" cy="120" r="10" fill="#0f172a"/><text x="200" y="124" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <text x="216" y="124" font-size="12" fill="#0f172a" font-weight="400">Configure</text>
  <circle cx="350" cy="120" r="10" fill="#1e293b"/><text x="350" y="124" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <text x="366" y="124" font-size="12" fill="#0f172a" font-weight="700">Review &amp; simulate</text>
  <circle cx="500" cy="120" r="10" fill="#e2e8f0"/><text x="500" y="124" font-size="11" text-anchor="middle" fill="#64748b" font-weight="600">4</text>
  <text x="516" y="124" font-size="12" fill="#64748b" font-weight="400">Deploy</text>
  <rect x="40" y="144" width="680" height="210" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="176" font-size="16" font-weight="700" fill="#0f172a">Step 3: Review &amp; simulate</text>
  <text x="60" y="196" font-size="12" fill="#64748b">Run a dry-run simulation to preview fees and resource usage before committing.</text>
  <rect x="60" y="212" width="640" height="84" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="76" y="234" font-size="13" font-weight="700" fill="#047857">✓ Simulation Succeeded</text>
  <text x="76" y="258" font-size="11" fill="#64748b">Min resource fee</text><text x="76" y="278" font-size="13" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">1,234,567 str</text>
  <text x="290" y="258" font-size="11" fill="#64748b">CPU instructions</text><text x="290" y="278" font-size="13" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">2,345,678</text>
  <text x="500" y="258" font-size="11" fill="#64748b">Memory</text><text x="500" y="278" font-size="13" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">1.2 MB</text>
  <rect x="60" y="310" width="70" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="95" y="330" font-size="12" text-anchor="middle" fill="#0f172a">‹ Back</text>
  <rect x="440" y="310" width="120" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="500" y="330" font-size="12" text-anchor="middle" fill="#0f172a">Re-Simulate</text>
  <rect x="570" y="310" width="130" height="30" rx="6" fill="#0f172a"/><text x="635" y="330" font-size="12" text-anchor="middle" fill="#fff" font-weight="600">Next: Deploy ›</text>
  <circle cx="48" cy="212" r="12" fill="#e11d48"/><text x="48" y="217" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">1</text>
  <circle cx="712" cy="310" r="12" fill="#e11d48"/><text x="712" y="315" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">2</text>
  <text x="40" y="382" font-size="12" fill="#be123c">① Fee and resource estimates appear after Run Simulation. ② Next: Deploy only appears once a simulation succeeds.</text>
</svg>
